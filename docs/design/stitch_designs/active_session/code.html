<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Manraah - Therapy Session</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#484551",
                        "outline-variant": "#cac4d3",
                        "inverse-surface": "#322e41",
                        "tertiary-container": "#a46172",
                        "outline": "#797582",
                        "tertiary": "#874959",
                        "surface-container-high": "#ece4fe",
                        "surface-bright": "#fdf7ff",
                        "surface-tint": "#6251a8",
                        "surface-container": "#f2ebff",
                        "inverse-on-surface": "#f5eeff",
                        "surface-container-highest": "#e6dff8",
                        "on-secondary-container": "#00725c",
                        "on-error": "#ffffff",
                        "secondary": "#006b56",
                        "on-tertiary-fixed": "#38091a",
                        "inverse-primary": "#cbbeff",
                        "secondary-fixed": "#88f7d6",
                        "surface-dim": "#ded6f0",
                        "on-primary-fixed": "#1d0061",
                        "surface-container-low": "#f7f1ff",
                        "on-tertiary-container": "#fffbff",
                        "on-primary-fixed-variant": "#4a388e",
                        "surface-variant": "#e6dff8",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#88f7d6",
                        "primary-fixed": "#e6deff",
                        "primary-fixed-dim": "#cbbeff",
                        "on-background": "#1d192b",
                        "on-primary-container": "#fffbff",
                        "surface": "#fdf7ff",
                        "tertiary-fixed": "#ffd9e0",
                        "background": "#fdf7ff",
                        "on-secondary-fixed-variant": "#005140",
                        "secondary-fixed-dim": "#6adaba",
                        "on-tertiary-fixed-variant": "#6e3444",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#002018",
                        "tertiary-fixed-dim": "#ffb1c3",
                        "primary-container": "#7867c0",
                        "primary": "#5f4ea5",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1d192b",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding-desktop": "64px",
                        "base": "8px",
                        "sm": "12px",
                        "lg": "48px",
                        "container-padding-mobile": "20px",
                        "md": "24px",
                        "xs": "4px",
                        "xl": "80px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Quicksand"],
                        "caption": ["Work Sans"],
                        "label-md": ["Work Sans"],
                        "headline-lg-mobile": ["Quicksand"],
                        "body-lg": ["Work Sans"],
                        "headline-md": ["Quicksand"],
                        "body-md": ["Work Sans"],
                        "display-lg": ["Quicksand"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="h-full bg-surface text-on-surface antialiased overflow-hidden">
<!-- Main Container -->
<main class="relative h-full w-full max-w-md mx-auto bg-surface-container-lowest shadow-2xl overflow-hidden md:rounded-[32px] md:my-8 md:h-[calc(100%-64px)]">
<!-- Video Feed Background (Therapist) -->
<div class="absolute inset-0 z-0">
<img alt="Therapist Video Feed" class="w-full h-full object-cover" data-alt="A medium close-up shot of a warm, compassionate female therapist, Dr. Sarah Jenkins, in a serene, modern office. She is smiling gently at the camera, conveying empathy and active listening. The lighting is soft and natural, with a light lavender blurred background hinting at a comfortable wellness sanctuary. The aesthetic is modern-organic, focusing on human connection." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAcQhSPxni8KxcwNXXQpTGDjaXfB7KAU-6WOnMZLGBga7Fh6890qB8c9roWZa8zNp3e5I_6x8qWXW_EVgQK9z0waUsh9rJv4Nvg_ZzNTXQjaw2T0NGTKYrfyqj5iG6DeCRV2RCOUaTjTHBiqWLdSz8XKcbeZNmHoFUpTFlGQByhJukOR2zNyDOARlSe61ymnHOgJAanyBJY5sXI3n9bnqkCqDpcgPi_dcMTOV4MHlsb4XCDC3nJYu3sLw">
<!-- Subtle gradient overlay for better text/UI visibility -->
<div class="absolute inset-0 bg-gradient-to-b from-surface-dim/40 via-transparent to-surface-dim/80"></div>
</div>
<!-- Top Header Area -->
<header class="relative z-10 flex justify-between items-start p-container-padding-mobile pt-[40px] md:pt-container-padding-mobile w-full">
<div class="flex flex-col gap-1">
<h1 class="font-headline-md text-headline-md text-on-surface drop-shadow-md">Dr. Sarah Jenkins</h1>
<div class="flex items-center gap-2 bg-surface-container/60 backdrop-blur-md rounded-full px-3 py-1 w-fit border border-surface/50 shadow-sm shadow-primary/5">
<span class="material-symbols-outlined fill text-secondary text-sm">shield</span>
<span class="font-caption text-caption text-secondary">Safe Space</span>
</div>
</div>
<!-- Connection Quality Indicator -->
<div class="bg-surface-container/60 backdrop-blur-md rounded-full p-2 border border-surface/50">
<span class="material-symbols-outlined text-secondary">signal_cellular_4_bar</span>
</div>
</header>
<!-- Self View (Picture-in-Picture) -->
<div class="absolute z-20 top-24 right-container-padding-mobile w-28 h-40 rounded-xl overflow-hidden shadow-lg shadow-primary/10 border-2 border-surface/80 bg-surface-variant">
<img alt="Self Video Feed" class="w-full h-full object-cover" data-alt="A small self-view video feed showing a young adult looking attentively at the screen. The background is slightly blurred, showing a neat, brightly lit living room. The lighting is flattering and soft, maintaining the warm, modern-organic wellness sanctuary aesthetic of the main app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCvGHcHWQHEygbtgy31fG1QDXq6nTFztApJSce7DApnGMPJcukMhxvryorQyeqyhtH0YV_MH86nccwII6lBKgpDPWeVb7_rPb_40t-gBH2NP83kVaLyIKX4mgo_aMIW0ksuasAYBruwY5xDe8qf_SccOmR3aM0K57dsutZkH3V6J9GIEVbg_zdLAzcf2XzfVcoLsjsqn-3HU_DuW0L5N0d71IDH6sP8IUVKQKrlBzMFSqb6K2bKg66erw">
</div>
<!-- Session Info & Controls Overlay -->
<div class="absolute bottom-0 left-0 w-full z-30 px-container-padding-mobile pb-10 pt-16 bg-gradient-to-t from-surface-container-highest via-surface-container-highest/80 to-transparent">
<!-- Timer -->
<div class="flex justify-center mb-6">
<div class="bg-surface/80 backdrop-blur-md px-4 py-1.5 rounded-full shadow-sm">
<span class="font-label-md text-label-md text-on-surface-variant">45:00 / 50:00</span>
</div>
</div>
<!-- Call Controls -->
<div class="flex justify-center items-center gap-6">
<!-- Mute Button -->
<button aria-label="Mute Microphone" class="w-14 h-14 flex items-center justify-center rounded-full bg-surface-variant/80 backdrop-blur-md text-on-surface hover:bg-surface-variant transition-colors shadow-sm shadow-primary/5 active:scale-95 duration-200">
<span class="material-symbols-outlined">mic</span>
</button>
<!-- Video Toggle -->
<button aria-label="Turn off Camera" class="w-14 h-14 flex items-center justify-center rounded-full bg-surface-variant/80 backdrop-blur-md text-on-surface hover:bg-surface-variant transition-colors shadow-sm shadow-primary/5 active:scale-95 duration-200">
<span class="material-symbols-outlined">videocam</span>
</button>
<!-- End Call Button (Prominent) -->
<button aria-label="End Call" class="w-16 h-16 flex items-center justify-center rounded-full bg-error text-on-error hover:bg-error/90 transition-colors shadow-md shadow-error/20 active:scale-95 duration-200">
<span class="material-symbols-outlined fill">call_end</span>
</button>
<!-- More Options -->
<button aria-label="More Options" class="w-14 h-14 flex items-center justify-center rounded-full bg-surface-variant/80 backdrop-blur-md text-on-surface hover:bg-surface-variant transition-colors shadow-sm shadow-primary/5 active:scale-95 duration-200">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</div>
</main>
</body></html>
