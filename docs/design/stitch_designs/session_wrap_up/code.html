<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Manraah - Session Escalation</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#6adaba",
                        "surface-tint": "#6251a8",
                        "surface-container-highest": "#e6dff8",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f7f1ff",
                        "background": "#fdf7ff",
                        "on-secondary-container": "#00725c",
                        "secondary-fixed": "#88f7d6",
                        "on-surface": "#1d192b",
                        "secondary": "#006b56",
                        "tertiary-fixed": "#ffd9e0",
                        "on-background": "#1d192b",
                        "inverse-on-surface": "#f5eeff",
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#484551",
                        "outline-variant": "#cac4d3",
                        "on-secondary-fixed-variant": "#005140",
                        "on-primary-fixed": "#1d0061",
                        "on-primary-container": "#fffbff",
                        "primary-fixed": "#e6deff",
                        "surface-bright": "#fdf7ff",
                        "on-primary-fixed-variant": "#4a388e",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#38091a",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#ffb1c3",
                        "surface": "#fdf7ff",
                        "inverse-primary": "#cbbeff",
                        "surface-container": "#f2ebff",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-dim": "#ded6f0",
                        "surface-container-high": "#ece4fe",
                        "tertiary": "#874959",
                        "outline": "#797582",
                        "tertiary-container": "#a46172",
                        "primary-container": "#7867c0",
                        "on-tertiary-container": "#fffbff",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#cbbeff",
                        "on-secondary-fixed": "#002018",
                        "secondary-container": "#88f7d6",
                        "inverse-surface": "#322e41",
                        "primary": "#5f4ea5",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e6dff8",
                        "on-tertiary-fixed-variant": "#6e3444"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "container-padding-mobile": "20px",
                        "container-padding-desktop": "64px",
                        "md": "24px",
                        "sm": "12px",
                        "base": "8px",
                        "lg": "48px",
                        "xl": "80px"
                    },
                    "fontFamily": {
                        "body-lg": ["Work Sans", "sans-serif"],
                        "body-md": ["Work Sans", "sans-serif"],
                        "display-lg": ["Quicksand", "sans-serif"],
                        "label-md": ["Work Sans", "sans-serif"],
                        "headline-lg": ["Quicksand", "sans-serif"],
                        "caption": ["Work Sans", "sans-serif"],
                        "headline-lg-mobile": ["Quicksand", "sans-serif"],
                        "headline-md": ["Quicksand", "sans-serif"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        .ambient-shadow {
            box-shadow: 0 10px 40px -10px rgba(124, 107, 196, 0.08);
        }
        
        .glow-hover:hover {
            box-shadow: 0 0 20px rgba(95, 78, 165, 0.15);
        }
        
        .selected-card {
            border-color: theme('colors.primary');
            background-color: theme('colors.primary-container') !important;
            color: theme('colors.on-primary-container');
        }
        
        .selected-card .icon-span {
            color: theme('colors.on-primary-container') !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-md overflow-hidden bg-surface relative">
<!-- Ambient background effect -->
<div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute top-[-10%] right-[-5%] w-96 h-96 bg-primary-fixed rounded-full blur-3xl opacity-40"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-96 h-96 bg-secondary-fixed rounded-full blur-3xl opacity-30"></div>
</div>
<!-- Main Container -->
<main class="w-full max-w-[800px] z-10 flex flex-col items-center">
<!-- Header Section -->
<header class="text-center mb-xl">
<div class="w-16 h-16 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center mx-auto mb-md ambient-shadow">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">task_alt</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary mb-sm">Session Complete</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[500px] mx-auto">
                Would you like to flag this conversation for review?
            </p>
</header>
<!-- Options Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md w-full mb-xl">
<!-- Option 1: Default -->
<button class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col items-start gap-sm ambient-shadow transition-all duration-300 hover:bg-surface-variant/50 focus:outline-none selected-card text-left" onclick="selectOption(this)">
<span class="material-symbols-outlined text-primary text-2xl icon-span" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-headline-md text-headline-md">No flag needed</span>
<span class="font-body-md text-body-md opacity-80">Session resolved normally. Just end the session.</span>
</button>
<!-- Option 2: Follow-up -->
<button class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col items-start gap-sm ambient-shadow transition-all duration-300 hover:bg-surface-variant/50 focus:outline-none text-left" onclick="selectOption(this)">
<span class="material-symbols-outlined text-tertiary text-2xl icon-span">mark_chat_unread</span>
<span class="font-headline-md text-headline-md text-on-surface">Needs follow-up</span>
<span class="font-body-md text-body-md text-on-surface-variant">Mark for later review by a human companion.</span>
</button>
<!-- Option 3: Escalate -->
<button class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col items-start gap-sm ambient-shadow transition-all duration-300 hover:bg-error-container/20 focus:outline-none border border-transparent hover:border-error/20 text-left" onclick="selectOption(this)">
<span class="material-symbols-outlined text-error text-2xl icon-span">emergency</span>
<span class="font-headline-md text-headline-md text-on-surface">Possible crisis</span>
<span class="font-body-md text-body-md text-on-surface-variant">Escalate immediately to professional care team.</span>
</button>
<!-- Option 4: Note -->
<button class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col items-start gap-sm ambient-shadow transition-all duration-300 hover:bg-surface-variant/50 focus:outline-none text-left" onclick="selectOption(this)">
<span class="material-symbols-outlined text-secondary text-2xl icon-span">edit_note</span>
<span class="font-headline-md text-headline-md text-on-surface">Just a note</span>
<span class="font-body-md text-body-md text-on-surface-variant">Add a contextual note without flagging for action.</span>
</button>
</div>
<!-- Action Area -->
<div class="w-full flex justify-center">
<button class="bg-primary text-on-primary font-label-md text-label-md px-xl py-sm rounded-full ambient-shadow glow-hover transition-all duration-300 hover:-translate-y-1 active:scale-95 flex items-center gap-sm bg-gradient-to-br from-primary to-surface-tint">
                Submit &amp; Close Dashboard
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</main>
<script>
        function selectOption(clickedElement) {
            // Remove selection from all cards
            const cards = document.querySelectorAll('button.bg-surface-container-lowest');
            cards.forEach(card => {
                card.classList.remove('selected-card');
                
                // Reset text colors inside based on their intended default state (simplistic reset for demo)
                const title = card.querySelector('.font-headline-md');
                const desc = card.querySelector('.font-body-md');
                const icon = card.querySelector('.material-symbols-outlined');
                
                title.classList.remove('text-on-primary-container');
                desc.classList.remove('text-on-primary-container', 'opacity-80');
                
                if(!card.isEqualNode(clickedElement)) {
                    title.classList.add('text-on-surface');
                    desc.classList.add('text-on-surface-variant');
                }
            });

            // Add selection to clicked card
            clickedElement.classList.add('selected-card');
            
            // Update text colors for selected state
            const title = clickedElement.querySelector('.font-headline-md');
            const desc = clickedElement.querySelector('.font-body-md');
            
            title.classList.remove('text-on-surface');
            desc.classList.remove('text-on-surface-variant');
            
            title.classList.add('text-on-primary-container');
            desc.classList.add('text-on-primary-container', 'opacity-80');
        }
    </script>
</body></html>
