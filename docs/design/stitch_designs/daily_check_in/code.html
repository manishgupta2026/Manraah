<!DOCTYPE html><html class="h-full" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Daily Check-in - Manraah</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                      "inverse-primary": "#cbbeff",
                      "secondary-fixed": "#88f7d6",
                      "surface-dim": "#ded6f0",
                      "on-primary-fixed": "#1d0061",
                      "surface-container-low": "#f7f1ff",
                      "on-tertiary-container": "#fffbff",

                      "surface-variant": "#e6dff8",

                      "secondary-container": "#88f7d6",
                      "primary-fixed": "#e6deff",
                      "primary-fixed-dim": "#cbbeff",
                      "on-background": "#1d192b",
                      "on-primary-container": "#fffbff",
                      "surface": "#fdf7ff",
                      "tertiary-fixed": "#ffd9e0",
                      "background": "#fdf7ff",
                      "on-secondary-fixed-variant": "#005140",
                      "secondary-fixed-dim": "#6adaba",
                      "on-tertiary-fixed-variant": "#6e3444",
                      "error-container": "#ffdad6",
                      "on-secondary": "#ffffff",
                      "error": "#ba1a1a",
                      "on-secondary-fixed": "#002018",
                      "tertiary-fixed-dim": "#ffb1c3",
                      "primary-container": "#7867c0",
                      "primary": "#5f4ea5",
                      "surface-container-lowest": "#ffffff",

                      "on-primary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "container-padding-desktop": "64px",
                      "base": "8px",
                      "sm": "12px",
                      "lg": "48px",
                      "container-padding-mobile": "20px",
                      "md": "24px",
                      "xs": "4px",
                      "xl": "80px"

              "fontFamily": {

          },
        }
      </script>
<style>
        .ambient-shadow {
            box-shadow: 0 10px 40px -10px rgba(124, 107, 196, 0.08);
        }
        .lift-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 50px -10px rgba(124, 107, 196, 0.12);
        }
        .step-transition {
            transition: opacity 0.4s ease-in-out, transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .hide-step {
            opacity: 0;
            transform: translateX(-20px);
            pointer-events: none;
            position: absolute;
            visibility: hidden;
        }
        .show-step {
            opacity: 1;
            transform: translateX(0);
            position: relative;
            visibility: visible;
        }
        .emoji-shadow {
            filter: drop-shadow(0 4px 12px rgba(124, 107, 196, 0.15));
        }
      </style>
</head>
<body class="bg-background text-on-background h-full font-sans antialiased overflow-hidden">
<!-- Top Nav Placeholder for context, mostly hidden on this focused task screen -->
<header class="w-full flex justify-between items-center h-16 px-container-padding-mobile fixed top-0 z-40 bg-surface/80 backdrop-blur-md">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-2 rounded-full hover:bg-surface-variant/50" onclick="window.history.back()">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<span class="font-label-md text-label-md text-on-surface-variant">Check-in</span>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="h-full pt-20 pb-safe px-container-padding-mobile flex flex-col max-w-[680px] mx-auto relative overflow-hidden">
<!-- Step 1: Mood Selection -->
<div class="step-transition show-step flex-1 flex flex-col justify-center" id="step1">
<div class="text-center mb-12">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">How are you feeling right now?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Tap the icon that best matches your mood.</p>
</div>
<div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
<button class="lift-hover transition-all duration-300 bg-surface-container-lowest rounded-[24px] p-6 flex flex-col items-center justify-center gap-3 ambient-shadow border border-transparent hover:border-primary/20" onclick="nextStep('Calm')">
<span class="text-5xl emoji-shadow">😌</span>
<span class="font-label-md text-label-md text-on-surface">Calm</span>
</button>
<button class="lift-hover transition-all duration-300 bg-surface-container-lowest rounded-[24px] p-6 flex flex-col items-center justify-center gap-3 ambient-shadow border border-transparent hover:border-primary/20" onclick="nextStep('Joyful')">
<span class="text-5xl emoji-shadow">✨</span>
<span class="font-label-md text-label-md text-on-surface">Joyful</span>
</button>
<button class="lift-hover transition-all duration-300 bg-surface-container-lowest rounded-[24px] p-6 flex flex-col items-center justify-center gap-3 ambient-shadow border border-transparent hover:border-primary/20" onclick="nextStep('Overwhelmed')">
<span class="text-5xl emoji-shadow">🌪️</span>
<span class="font-label-md text-label-md text-on-surface">Overwhelmed</span>
</button>
<button class="lift-hover transition-all duration-300 bg-surface-container-lowest rounded-[24px] p-6 flex flex-col items-center justify-center gap-3 ambient-shadow border border-transparent hover:border-primary/20" onclick="nextStep('Sad')">
<span class="text-5xl emoji-shadow">🌧️</span>
<span class="font-label-md text-label-md text-on-surface">Sad</span>
</button>
<button class="lift-hover transition-all duration-300 bg-surface-container-lowest rounded-[24px] p-6 flex flex-col items-center justify-center gap-3 ambient-shadow border border-transparent hover:border-primary/20 col-span-2 sm:col-span-1" onclick="nextStep('Anxious')">
<span class="text-5xl emoji-shadow">⚡</span>
<span class="font-label-md text-label-md text-on-surface">Anxious</span>
</button>
</div>
</div>
<!-- Step 2: Contributing Factors -->
<div class="step-transition hide-step flex-1 flex flex-col pt-8" id="step2">
<div class="mb-8">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">What's contributing to this?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Select all that apply.</p>
</div>
<div class="flex flex-wrap gap-3 mb-auto">
<button class="tag-btn px-5 py-3 rounded-full bg-surface-container text-on-surface font-label-md text-label-md transition-colors border border-transparent" onclick="toggleTag(this)">Work</button>
<button class="tag-btn px-5 py-3 rounded-full bg-surface-container text-on-surface font-label-md text-label-md transition-colors border border-transparent" onclick="toggleTag(this)">Family</button>
<button class="tag-btn px-5 py-3 rounded-full bg-surface-container text-on-surface font-label-md text-label-md transition-colors border border-transparent" onclick="toggleTag(this)">Health</button>
<button class="tag-btn px-5 py-3 rounded-full bg-surface-container text-on-surface font-label-md text-label-md transition-colors border border-transparent" onclick="toggleTag(this)">Sleep</button>
<button class="tag-btn px-5 py-3 rounded-full bg-surface-container text-on-surface font-label-md text-label-md transition-colors border border-transparent" onclick="toggleTag(this)">Social</button>
<button class="tag-btn px-5 py-3 rounded-full bg-surface-container text-on-surface font-label-md text-label-md transition-colors border border-transparent" onclick="toggleTag(this)">Finances</button>
<button class="tag-btn px-5 py-3 rounded-full bg-surface-container text-on-surface font-label-md text-label-md transition-colors border border-transparent" onclick="toggleTag(this)">Weather</button>
</div>
<div class="mt-8 mb-12">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-label-md text-label-md py-4 rounded-full lift-shadow active:scale-95 transition-all flex items-center justify-center gap-2" onclick="submitCheckin()">
<span>Submit Check-in</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<button class="w-full mt-4 text-on-surface-variant font-label-md text-label-md py-3 rounded-full hover:bg-surface-variant/50 transition-colors" onclick="prevStep()">
                    Back
                </button>
</div>
</div>
<!-- Success Screen -->
<div class="step-transition hide-step flex-1 flex flex-col items-center justify-center text-center" id="step3">
<div class="w-32 h-32 bg-secondary-container/30 rounded-full flex items-center justify-center mb-8 relative">
<span class="material-symbols-outlined text-6xl text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<!-- Subtle decorative circles -->
<div class="absolute w-full h-full rounded-full border-4 border-secondary/20 animate-ping" style="animation-duration: 2s;"></div>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-4">Thank you for sharing</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-12 max-w-xs">Taking a moment to check in is a beautiful step towards self-compassion today.</p>
<button class="bg-surface-container-highest text-on-surface font-label-md text-label-md py-3 px-8 rounded-full hover:bg-surface-variant transition-colors" onclick="window.history.back()">
                Return to Home
            </button>
</div>
</main>
<script>
        let selectedMood = '';

        function nextStep(mood) {
            selectedMood = mood;
            document.getElementById('step1').classList.remove('show-step');
            document.getElementById('step1').classList.add('hide-step');
            
            setTimeout(() => {
                document.getElementById('step2').classList.remove('hide-step');
                document.getElementById('step2').classList.add('show-step');
            }, 300); // slight delay for visual transition
        }

        function prevStep() {
            document.getElementById('step2').classList.remove('show-step');
            document.getElementById('step2').classList.add('hide-step');
            
            setTimeout(() => {
                document.getElementById('step1').classList.remove('hide-step');
                document.getElementById('step1').classList.add('show-step');
            }, 300);
        }

        function toggleTag(btn) {
            btn.classList.toggle('bg-primary-container');
            btn.classList.toggle('text-on-primary-container');
            btn.classList.toggle('border-primary');
            
            btn.classList.toggle('bg-surface-container');
            btn.classList.toggle('text-on-surface');
            btn.classList.toggle('border-transparent');
        }

        function submitCheckin() {
            document.getElementById('step2').classList.remove('show-step');
            document.getElementById('step2').classList.add('hide-step');
            
            setTimeout(() => {
                document.getElementById('step3').classList.remove('hide-step');
                document.getElementById('step3').classList.add('show-step');
            }, 300);
        }
    </script>
</body></html>
