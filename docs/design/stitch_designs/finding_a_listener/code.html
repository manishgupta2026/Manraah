<style>
        @keyframes breathe {
            0%, 100% {
                transform: scale(0.8);
                opacity: 0.2;
            }
            50% {
                transform: scale(1.5);
                opacity: 0.8;
            }
        }
        .breathe-animation-1 {
            animation: breathe 4s ease-in-out infinite;
        }
        .breathe-animation-2 {
            animation: breathe 4s ease-in-out infinite 1s;
        }
        .breathe-animation-3 {
            animation: breathe 4s ease-in-out infinite 2s;
        }
        
        .fade-text {
            animation: fadeText 9s linear infinite;
        }
        
        @keyframes fadeText {
            0%, 30% { content: "Finding someone who's available..."; opacity: 1; }
            33% { opacity: 0; }
            34%, 63% { content: "Almost there..."; opacity: 1; }
            66% { opacity: 0; }
            67%, 96% { content: "Creating a safe space for you..."; opacity: 1; }
            100% { opacity: 0; }
        }
        
        /* Fallback for content replacement if CSS content animation is not supported widely enough, using JS instead */
        .text-cycler {
            transition: opacity 0.5s ease;
        }
        
        .bg-peach-glow {
            background: radial-gradient(circle at center, rgba(255, 217, 224, 0.4) 0%, rgba(253, 247, 255, 1) 70%);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-between font-body-md relative overflow-hidden bg-peach-glow">
<!-- Top Spacer for visual balance -->
<div class="h-24"></div>
<!-- Central Breathing Animation -->
<main class="flex-1 flex flex-col items-center justify-center w-full px-container-padding-mobile md:px-container-padding-desktop">
<div class="relative w-64 h-64 flex items-center justify-center mb-12">
<!-- Pulsing Rings -->
<div class="absolute inset-0 rounded-full bg-secondary-container breathe-animation-1 pointer-events-none"></div>
<div class="absolute inset-0 rounded-full bg-secondary-container breathe-animation-2 pointer-events-none"></div>
<div class="absolute inset-0 rounded-full bg-secondary-container breathe-animation-3 pointer-events-none"></div>
<!-- Central Avatar Background -->
<div class="relative z-10 w-24 h-24 bg-surface-container-lowest rounded-full shadow-sm shadow-primary/5 flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-outline-variant" style="font-variation-settings: 'FILL' 1;">
                    person
                </span>
</div>
</div>
<!-- Cycling Text -->
<div class="h-16 flex items-center justify-center text-center">
<h2 class="font-headline-md text-headline-md md:font-headline-lg md:text-headline-lg text-primary text-cycler" id="loading-text">
                Finding someone who's available...
            </h2>
</div>
</main>
<!-- Bottom Actions -->
<footer class="w-full pb-container-padding-mobile pt-lg flex justify-center z-20">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors px-4 py-2 rounded-full hover:bg-surface-variant/50">
            Cancel
        </button>
</footer>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const messages = [
                "Finding someone who's available...",
                "Almost there...",
                "Creating a safe space for you..."
            ];
            const textElement = document.getElementById('loading-text');
            let currentIndex = 0;

            setInterval(() => {
                // Fade out
                textElement.style.opacity = 0;
                
                setTimeout(() => {
                    // Change text and fade in
                    currentIndex = (currentIndex + 1) % messages.length;
                    textElement.textContent = messages[currentIndex];
                    textElement.style.opacity = 1;
                }, 500); // Wait for fade out to complete
                
            }, 3000); // Change message every 3 seconds
        });
    </script>
