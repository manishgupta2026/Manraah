<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col pulse-bg">
<!-- Top Bar -->
<header class="flex justify-between items-center p-container-padding-mobile pt-safe pt-8 z-10">
<button class="text-on-surface-variant hover:text-primary transition-colors active:scale-95">
<span class="material-symbols-outlined text-3xl">arrow_back</span>
</button>
<span class="font-headline-md text-headline-md text-primary">Immediate Support</span>
<div class="w-8"></div> <!-- Spacer for alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-container-padding-mobile pb-xl">
<!-- Reassuring Header -->
<div class="flex flex-col items-center text-center mt-md mb-lg">
<div class="w-20 h-20 rounded-full bg-primary-container/20 flex items-center justify-center mb-sm shadow-ambient">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm px-4">
                You're not alone.
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[300px]">
                Let's get you the support you need right now.
            </p>
</div>
<!-- Action Cards -->
<div class="flex flex-col gap-sm flex-1">
<!-- Primary Action: Chat -->
<button class="bg-primary text-on-primary rounded-[24px] p-md flex items-center shadow-ambient hover:shadow-md active:scale-95 transition-all duration-300 group relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="w-12 h-12 rounded-full bg-on-primary/20 flex items-center justify-center mr-md shrink-0">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
</div>
<div class="text-left flex-1">
<h3 class="font-label-md text-label-md text-lg mb-xs">Talk to someone now</h3>
<p class="font-body-md text-sm text-primary-fixed-dim">Connect with a trained companion</p>
</div>
<span class="material-symbols-outlined text-primary-fixed-dim group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
<!-- Secondary Action: Helpline -->
<button class="bg-surface-container-lowest text-on-surface rounded-[24px] p-md flex items-center shadow-ambient hover:shadow-md active:scale-95 transition-all duration-300 group border border-outline-variant/10">
<div class="w-12 h-12 rounded-full bg-secondary-container/30 flex items-center justify-center mr-md shrink-0 text-secondary">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">call</span>
</div>
<div class="text-left flex-1">
<h3 class="font-label-md text-label-md text-lg mb-xs">Call a Helpline</h3>
<p class="font-body-md text-sm text-on-surface-variant">Speak with a professional directly</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
<!-- Tertiary Action: Friend -->
<button class="bg-surface-container-lowest text-on-surface rounded-[24px] p-md flex items-center shadow-ambient hover:shadow-md active:scale-95 transition-all duration-300 group border border-outline-variant/10">
<div class="w-12 h-12 rounded-full bg-tertiary-container/20 flex items-center justify-center mr-md shrink-0 text-tertiary">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">people</span>
</div>
<div class="text-left flex-1">
<h3 class="font-label-md text-label-md text-lg mb-xs">Message a Trusted Friend</h3>
<p class="font-body-md text-sm text-on-surface-variant">Reach out to your pre-selected contacts</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
</div>
<!-- Dismiss Button -->
<div class="mt-lg mb-xl flex justify-center pb-20">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary py-sm px-lg rounded-full hover:bg-surface-variant/50 transition-colors active:scale-95">
                I'm okay now
            </button>
</div>
