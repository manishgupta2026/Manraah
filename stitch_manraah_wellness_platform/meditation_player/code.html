<style>
        .breathe-animation {
            animation: breathe 8s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.6); opacity: 0.2; }
        }
        .ambient-shadow {
            box-shadow: 0 20px 50px rgba(136, 247, 214, 0.15), 0 0 100px rgba(106, 218, 186, 0.1);
        }
        .play-shadow {
             box-shadow: 0 10px 30px rgba(95, 78, 165, 0.15);
        }
    </style>
</head>
<body class="bg-surface h-full w-full overflow-hidden flex flex-col font-body-md text-on-surface antialiased bg-gradient-to-b from-secondary-fixed/20 to-surface">
<!-- Header (Task-focused context, implies departure, no shell navigation needed here) -->
<header class="w-full pt-12 pb-md px-container-padding-mobile flex justify-between items-center z-10">
<button aria-label="Close Player" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-highest/50 backdrop-blur-md text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-headline-md text-headline-md text-on-surface">Mindful Morning</h1>
<span class="font-caption text-caption text-on-surface-variant">10:00</span>
</div>
<button aria-label="Player Settings" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-highest/50 backdrop-blur-md text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">more_horiz</span>
</button>
</header>
<!-- Main Player Area -->
<main class="flex-1 flex flex-col items-center justify-center relative px-container-padding-mobile z-0">
<!-- Breathing Circle Visualization -->
<div class="relative w-64 h-64 flex items-center justify-center mb-xl">
<!-- Pulsing background rings -->
<div class="absolute inset-0 rounded-full bg-secondary-fixed breathe-animation" style="animation-delay: -2s;"></div>
<div class="absolute inset-4 rounded-full bg-secondary-fixed-dim breathe-animation" style="animation-delay: -1s;"></div>
<div class="absolute inset-8 rounded-full bg-secondary-container breathe-animation"></div>
<!-- Central Solid Ring -->
<div class="relative w-32 h-32 rounded-full bg-surface/80 backdrop-blur-xl flex flex-col items-center justify-center ambient-shadow z-10 border border-white/50">
<span class="font-label-md text-label-md text-secondary tracking-widest uppercase mb-1">Inhale</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">04</span>
</div>
</div>
<!-- Controls -->
<div class="w-full max-w-sm flex items-center justify-center gap-lg mt-md">
<button aria-label="Stop Session" class="w-16 h-16 rounded-full flex items-center justify-center bg-surface-container-lowest ambient-shadow text-on-surface-variant hover:text-primary transition-all active:scale-95">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">stop</span>
</button>
<button aria-label="Play/Pause" class="w-24 h-24 rounded-full flex items-center justify-center bg-gradient-to-br from-primary to-primary-container play-shadow text-on-primary hover:opacity-90 transition-all active:scale-95">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button aria-label="Skip Forward" class="w-16 h-16 rounded-full flex items-center justify-center bg-surface-container-lowest ambient-shadow text-on-surface-variant hover:text-primary transition-all active:scale-95">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 0;">fast_forward</span>
</button>
</div>
</main>
<!-- Bottom Nav is suppressed because this is a focused, immersive task (Meditation Player) -->
</body></html>
