<body class="font-body-md text-on-surface bg-background pb-[100px] md:pb-0 overflow-x-hidden min-h-screen relative">
<!-- Top App Bar (Mobile) -->
<header class="flex justify-between items-center px-container-padding-mobile py-md bg-surface/80 backdrop-blur-md sticky top-0 z-40 md:hidden shadow-sm shadow-primary/5">
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">Manraah</h1>
</div>
<div class="flex items-center gap-sm">
<button class="p-2 rounded-full hover:bg-primary-container/20 transition-all text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-high ring-2 ring-primary-container/20">
<img class="w-full h-full object-cover" data-alt="A serene headshot portrait of a young student with a gentle smile, set against a soft, blurred lavender background. The lighting is warm and natural, emphasizing a calm and approachable mood. The aesthetic is clean and modern, fitting for a wellness app avatar." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDsz3it__C-Y0efhHJ_ulN4MZekPRfCtl0UtFQRu9DObh5xGvK3brJVJUOWEoygQ7FIUu-i12cvJAjcSD0gH6T1nwXHeLtjsvPbtcIO9K3DHHMmk2GvnDCLcx9ppu9P4w-GXsiRQQlTId4vELZEt6Mlvtkp-0HG861tJrYGKA4CQzs8rVeIW72UzyYuGFAGIkrU5IupX1wfcQZStRPhWG9qrgwxfS6laR_amDC_8VzwcHmamhFuB6W2TA"/>
</div>
</div>
</header>
<main class="px-container-padding-mobile pt-sm pb-lg md:hidden flex flex-col gap-lg">
<!-- Greeting -->
<section class="animate-[fadeIn_0.5s_ease-out]">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Good morning, Alex.</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Your sanctuary is ready.</p>
</section>
<!-- Mood Selector -->
<section class="bg-surface-container-lowest rounded-[24px] p-md ambient-shadow">
<h3 class="font-label-md text-label-md text-on-surface-variant mb-sm uppercase tracking-wide">How are you feeling?</h3>
<div class="flex justify-between items-center px-sm">
<button class="flex flex-col items-center gap-xs group active:scale-90 transition-transform">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-2xl group-hover:bg-primary-container/20 transition-colors">😫</div>
</button>
<button class="flex flex-col items-center gap-xs group active:scale-90 transition-transform">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-2xl group-hover:bg-primary-container/20 transition-colors">😔</div>
</button>
<button class="flex flex-col items-center gap-xs group active:scale-90 transition-transform relative">
<div class="w-14 h-14 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center text-3xl shadow-md shadow-primary/30">😐</div>
<div class="absolute -bottom-1 w-1 h-1 rounded-full bg-primary"></div>
</button>
<button class="flex flex-col items-center gap-xs group active:scale-90 transition-transform">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-2xl group-hover:bg-primary-container/20 transition-colors">🙂</div>
</button>
<button class="flex flex-col items-center gap-xs group active:scale-90 transition-transform">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-2xl group-hover:bg-primary-container/20 transition-colors">🥰</div>
</button>
</div>
</section>

<button class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col items-center justify-center gap-sm ambient-shadow hover:bg-surface-container-low transition-colors active:scale-95">
<div class="w-12 h-12 rounded-full bg-secondary-container/30 text-on-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-[28px]" data-icon="smart_toy">smart_toy</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Talk to AI</span>
</button>
<button class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col items-center justify-center gap-sm ambient-shadow hover:bg-surface-container-low transition-colors active:scale-95">

<span class="material-symbols-outlined text-[28px]" data-icon="diversity_1">diversity_1</span>
</div>
<span class="font-label-md text-label-md text-on-surface text-center">Human Guide</span>
</button>
<button class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col items-center justify-center gap-sm ambient-shadow hover:bg-surface-container-low transition-colors active:scale-95">
<div class="w-12 h-12 rounded-full bg-primary-container/20 text-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[28px]" data-icon="edit_note">edit_note</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Journal</span>
</button>
<button class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col items-center justify-center gap-sm ambient-shadow hover:bg-surface-container-low transition-colors active:scale-95">
<div class="w-12 h-12 rounded-full bg-[#E5F6F1] text-secondary flex items-center justify-center">
<span class="material-symbols-outlined text-[28px]" data-icon="self_improvement">self_improvement</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Meditation</span>
</button>
</section>
<!-- Insights Row (Active Program & Focus Score) -->
<section class="flex flex-col gap-md">
<!-- Active Program -->
<div class="bg-surface-container-lowest rounded-[24px] p-md ambient-shadow relative overflow-hidden flex flex-col">
<div class="absolute -right-6 -top-6 w-32 h-32 bg-secondary-container/20 rounded-full blur-2xl"></div>
<div class="flex justify-between items-start mb-md relative z-10">
<div>
<span class="font-caption text-caption text-on-surface-variant bg-surface-variant/50 px-2 py-1 rounded-full mb-2 inline-block">Active Program</span>
<h3 class="font-label-md text-label-md text-on-surface font-bold">Managing Exam Anxiety</h3>
</div>
<span class="material-symbols-outlined text-secondary" data-icon="school">school</span>
</div>
<div class="relative z-10 mt-auto">
<div class="flex justify-between text-caption font-caption text-on-surface-variant mb-xs">
<span>Day 3 of 7</span>
<span>42%</span>

<div class="h-3 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-secondary to-[#6adaba] rounded-full w-[42%]"></div>
</div>
</div>
</div>

<div>
<h3 class="font-label-md text-label-md text-on-surface font-bold mb-xs">Daily Focus</h3>
<p class="font-caption text-caption text-on-surface-variant">Looking good today!</p>
</div>
<div class="relative w-20 h-20 flex items-center justify-center">
<svg class="w-full h-full" viewbox="0 0 100 100">
<circle class="text-surface-variant stroke-current" cx="50" cy="50" fill="transparent" r="40" stroke-width="8"></circle>
<circle class="text-primary stroke-current progress-ring__circle" cx="50" cy="50" fill="transparent" r="40" stroke-dasharray="251.2" stroke-dashoffset="55.26" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<span class="font-headline-md text-headline-md text-primary font-bold">78<span class="text-sm">%</span></span>
</div>
</div>
</div>
</section>
<!-- Upcoming Focus Blocks -->
<section class="bg-surface-container-lowest rounded-[24px] p-md ambient-shadow">
<div class="flex justify-between items-center mb-md">
<h3 class="font-label-md text-label-md text-on-surface font-bold">Upcoming Focus Blocks</h3>
<button class="text-primary text-sm font-label-md hover:underline">View All</button>
</div>
<div class="flex flex-col gap-sm">
<div class="flex items-center gap-md p-sm rounded-xl hover:bg-surface-container-low transition-colors">
<div class="w-2 h-10 bg-primary/40 rounded-full"></div>
<div class="flex-1">
<h4 class="font-label-md text-label-md text-on-surface">Psych 101 Notes Review</h4>
<p class="font-caption text-caption text-on-surface-variant">10:00 AM - 11:30 AM</p>
</div>
<button class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:bg-primary-container/20 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="play_arrow">play_arrow</span>
</button>
</div>
<div class="w-full h-px bg-outline-variant/30 border-dashed border-b border-outline-variant/30"></div>
<div class="flex items-center gap-md p-sm rounded-xl hover:bg-surface-container-low transition-colors">
<div class="w-2 h-10 bg-secondary/40 rounded-full"></div>
<div class="flex-1">
<h4 class="font-label-md text-label-md text-on-surface">Lab Report Draft</h4>
<p class="font-caption text-caption text-on-surface-variant">2:00 PM - 4:00 PM</p>
</div>
<button class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:bg-primary-container/20 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="play_arrow">play_arrow</span>

</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-all relative -top-3">
<div class="w-14 h-14 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-lg shadow-primary/30">
<span class="material-symbols-outlined text-2xl" data-icon="chat_bubble">chat_bubble</span>
</div>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-all">
<span class="material-symbols-outlined" data-icon="local_library">local_library</span>
<span class="text-[10px] mt-1">Resources</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary active:scale-90 transition-all">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="text-[10px] mt-1">Profile</span>
</button>
