<div class="fixed bottom-0 left-0 w-full p-container-padding-mobile pb-lg bg-gradient-to-t from-background via-background/90 to-transparent z-20 flex justify-center">
<!-- Disabled state initially until a category is selected -->
<button class="w-full max-w-[400px] h-[56px] rounded-full bg-surface-variant text-on-surface-variant font-label-md text-label-md transition-all flex items-center justify-center opacity-70 cursor-not-allowed">
            Continue
        </button>
</div>
<!-- Script for simple interaction demonstration -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('main > button');
            const continueBtn = document.querySelector('.fixed.bottom-0 button');

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    // Reset all
                    cards.forEach(c => {
                        c.classList.remove('ring-2', 'ring-primary');
                        c.style.transform = 'scale(1)';
                    });
                    
                    // Select current
                    card.classList.add('ring-2', 'ring-primary');
                    
                    // Enable button
                    continueBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant', 'opacity-70', 'cursor-not-allowed');
                    continueBtn.classList.add('bg-gradient-to-br', 'from-primary', 'to-primary-container', 'text-on-primary', 'ambient-shadow', 'hover:scale-[1.02]', 'active:scale-95', 'cursor-pointer');
                });
            });
        });
    </script>
