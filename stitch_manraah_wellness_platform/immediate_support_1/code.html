<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Ambient breath animation for the background glow to induce calmness */
        @keyframes ambientBreath {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        .animate-ambient-breath {
            animation: ambientBreath 8s ease-in-out infinite;
        }
    </style>

<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col relative overflow-hidden">
<!-- Ambient Warmth Background (Soft Peach/Warm Vibe using theme colors) -->
<div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center overflow-hidden">
<!-- Using tertiary-fixed for a soft, warm peach-like glow without being aggressive red -->
<div class="w-[120vw] h-[120vw] md:w-[80vw] md:h-[80vw] max-w-[1000px] max-h-[1000px] bg-tertiary-fixed rounded-full blur-[120px] md:blur-[150px] opacity-60 animate-ambient-breath absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 mix-blend-multiply"></div>
</div>
<!-- Main Content Canvas (Focused Journey, no Nav Shell) -->
<main class="relative z-10 flex-1 flex flex-col items-center justify-center p-container-padding-mobile md:p-container-padding-desktop w-full max-w-[680px] mx-auto min-h-screen">
<!-- Comforting Header Section -->
<div class="text-center mb-12 flex flex-col items-center w-full">
<div class="w-24 h-24 bg-surface-container-lowest rounded-full flex items-center justify-center mb-8 shadow-[0_8px_30px_rgba(124,107,196,0.12)]">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">volunteer_activism</span>
</div>
<!-- Headline responsive sizing -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-display-lg md:text-display-lg text-on-surface mb-4">
                You're not alone.
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md px-4">
                Let's get you the support you need right now.
            </p>
</div>
<!-- Action Buttons (Bento List style for clarity and ease of tapping) -->
<div class="w-full flex flex-col gap-sm md:gap-md mb-12 px-2 md:px-0">
<!-- Action 1: Primary Support -->
<button class="w-full bg-primary-container/20 hover:bg-primary-container/30 border border-primary/10 rounded-[24px] p-6 flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-6 transition-all duration-300 hover:scale-[1.01] active:scale-95 group shadow-sm shadow-primary/5 text-left">
<div class="w-14 h-14 shrink-0 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
</div>
<div class="flex-1">
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">Talk to someone now</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Connect with a trained companion via chat.</p>
</div>
<div class="hidden sm:flex w-10 h-10 rounded-full bg-surface-container-lowest items-center justify-center group-hover:bg-primary group-hover:text-on-primary transition-colors shadow-sm">
<span class="material-symbols-outlined">arrow_forward</span>
</div>
</button>
<!-- Action 2: Helpline -->
<button class="w-full bg-surface-container-lowest hover:bg-surface-container-low rounded-[24px] p-6 flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-6 transition-all duration-300 hover:scale-[1.01] active:scale-95 group shadow-[0_8px_40px_rgba(124,107,196,0.06)] text-left">
<div class="w-14 h-14 shrink-0 rounded-full bg-secondary-container/50 flex items-center justify-center text-on-secondary-container group-hover:bg-secondary-container transition-colors">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">call</span>
</div>
<div class="flex-1">
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">Call a Helpline</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Speak directly with a support professional.</p>
</div>
</button>
<!-- Action 3: Trusted Contact -->
<button class="w-full bg-surface-container-lowest hover:bg-surface-container-low rounded-[24px] p-6 flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-6 transition-all duration-300 hover:scale-[1.01] active:scale-95 group shadow-[0_8px_40px_rgba(124,107,196,0.06)] text-left">
<div class="w-14 h-14 shrink-0 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant group-hover:bg-outline-variant/30 transition-colors">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">group</span>
</div>
<div class="flex-1">
<h3 class="font-headline-md text-headline-md text-on-surface mb-1">Message a Trusted Friend</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Reach out to your pre-selected contacts.</p>
</div>
</button>
</div>
<!-- Dismiss / Return to Normalcy Action -->
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-all duration-200 underline decoration-outline-variant/50 underline-offset-8 hover:decoration-primary px-6 py-3 rounded-full hover:bg-surface-variant/40 active:scale-95 mt-auto sm:mt-0">
            I'm okay now
        </button>
