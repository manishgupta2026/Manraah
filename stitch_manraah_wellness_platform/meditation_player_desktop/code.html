<style>
        .breathing-circle {
            animation: breathe 8s infinite ease-in-out;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.4); opacity: 0.2; }
        }
        
        .ambient-bg {
            background: linear-gradient(135deg, rgba(253, 247, 255, 0.9) 0%, rgba(222, 214, 240, 0.8) 100%);
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-full overflow-hidden flex items-center justify-center relative font-body-md">
<!-- Background Image -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="A highly atmospheric, ultra-high-resolution photograph of a serene forest at dawn. The scene is bathed in a soft, ethereal mist, with gentle morning sunlight filtering through the tall, organic tree trunks. The color palette features muted earthy greens, soft lavender greys, and pale whites to match a modern light-mode wellness aesthetic. The composition is calm, expansive, and deeply relaxing, providing a perfect backdrop for meditation without being visually overwhelming." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCEQ2n-NUmBs39ePy2zkaIXDKQsp8ThYfAgB2HpjzAntL3QjCf4y1plRHIaWj5I3QiX6LxEAwXMMsctsVcnZsWGgZU-kUhs3xtw4ljzovACC-vrraxSZiNQuSMQ9mDAc5Cr_5L1O7Zqn_oa0qV2u2g8NLDLogvgxEYcFqyehUp_vvpw9duEk9jd3snRtE6EBvb6TEDD3Gshbs0TF43lsOJZ4KJZudcrr8Jwh19TBFouJoTXMhAKrnF9aw')"></div>
<!-- Gradient Overlay for readability and softness -->
<div class="absolute inset-0 w-full h-full ambient-bg backdrop-blur-md"></div>
<!-- Main Player Container -->
<main class="relative z-10 w-full max-w-[1200px] h-full px-container-padding-desktop py-lg flex flex-col justify-between items-center text-center">
<!-- Header Section -->
<header class="w-full flex justify-between items-start">
<div class="flex flex-col items-start">
<span class="font-label-md text-label-md text-primary uppercase tracking-widest mb-2">Meditation &amp; Sleep</span>
<h1 class="font-display-lg text-display-lg text-on-surface">Mindful Morning</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-2">15 Min • Guided Breathing</p>
</div>
<!-- Close Button (Returns to Dashboard) -->
<button aria-label="Exit Meditation" class="flex items-center justify-center w-12 h-12 rounded-full bg-surface-container hover:bg-surface-variant transition-colors shadow-sm shadow-primary/5 group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors text-2xl">close</span>
</button>
</header>
<!-- Centerpiece: Breathing Visualizer -->
<div class="flex-1 flex flex-col items-center justify-center w-full relative my-xl">
<!-- Breathing Rings -->
<div class="relative w-64 h-64 md:w-96 md:h-96 flex items-center justify-center">
<div class="absolute w-full h-full rounded-full bg-secondary-container/40 blur-2xl breathing-circle"></div>
<div class="absolute w-3/4 h-3/4 rounded-full bg-secondary-container/60 blur-xl breathing-circle" style="animation-delay: -2s;"></div>
<div class="absolute w-1/2 h-1/2 rounded-full bg-secondary/20 blur-md breathing-circle" style="animation-delay: -4s;"></div>
<!-- Central Instruction -->
<div class="z-10 flex flex-col items-center">
<span class="font-headline-md text-headline-md text-on-secondary-container tracking-widest mb-1" id="instruction-text">INHALE</span>
<span class="font-display-lg text-display-lg text-secondary" id="instruction-timer">04</span>
</div>
</div>
</div>
<!-- Bottom Controls & Progress -->
<div class="w-full max-w-[680px] flex flex-col items-center gap-lg">
<!-- Progress Bar -->
<div class="w-full flex items-center gap-4">
<span class="font-label-md text-label-md text-on-surface-variant w-12 text-right">04:12</span>
<div class="flex-1 h-3 bg-surface-container-highest rounded-full overflow-hidden relative cursor-pointer group">
<div class="absolute top-0 left-0 h-full bg-gradient-to-r from-primary to-primary-container rounded-full w-[28%] group-hover:from-primary-container group-hover:to-primary transition-all"></div>
</div>
<span class="font-label-md text-label-md text-on-surface-variant w-12 text-left">15:00</span>
</div>
<!-- Playback Controls -->
<div class="flex items-center justify-center gap-8">
<!-- Volume Control (Optional secondary action) -->
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors hover:bg-primary/5">
<span class="material-symbols-outlined text-2xl">volume_up</span>
</button>
<!-- Rewind 15s -->
<button class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface hover:text-primary transition-colors hover:bg-primary/10">
<span class="material-symbols-outlined text-3xl">replay_10</span>
</button>
<!-- Play/Pause -->
<button class="w-20 h-20 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg shadow-primary/20 hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<!-- Forward 15s -->
<button class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface hover:text-primary transition-colors hover:bg-primary/10">
<span class="material-symbols-outlined text-3xl">forward_10</span>
</button>
<!-- Settings/Options -->
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors hover:bg-primary/5">
<span class="material-symbols-outlined text-2xl">more_vert</span>
</button>
</div>
</div>
</main>
<script>
        // Simple script to simulate the breathing cycle text change for visual effect
        const textEl = document.getElementById('instruction-text');
        const timerEl = document.getElementById('instruction-timer');
        let state = 'INHALE';
        let count = 4;

        setInterval(() => {
            count--;
            if (count < 1) {
                if (state === 'INHALE') {
                    state = 'HOLD';
                    count = 4;
                } else if (state === 'HOLD') {
                    state = 'EXHALE';
                    count = 4;
                } else {
                    state = 'INHALE';
                    count = 4;
                }
                textEl.innerText = state;
            }
            timerEl.innerText = count.toString().padStart(2, '0');
        }, 1000);
    </script>
</body></html>
