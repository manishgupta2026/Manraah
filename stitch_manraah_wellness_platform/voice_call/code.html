<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Manraah - Anonymous Call</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#6adaba",

                        "secondary-fixed": "#88f7d6",
                        "on-surface": "#1d192b",
                        "secondary": "#006b56",
                        "tertiary-fixed": "#ffd9e0",
                        "on-background": "#1d192b",
                        "inverse-on-surface": "#f5eeff",
                        "on-secondary": "#ffffff",
                        "on-surface-variant": "#484551",
                        "outline-variant": "#cac4d3",
                        "on-secondary-fixed-variant": "#005140",
                        "on-primary-fixed": "#1d0061",
                        "on-primary-container": "#fffbff",
                        "primary-fixed": "#e6deff",
                        "surface-bright": "#fdf7ff",
                        "on-primary-fixed-variant": "#4a388e",
                        "error": "#ba1a1a",
                        "on-tertiary-fixed": "#38091a",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#ffb1c3",
                        "surface": "#fdf7ff",

                        "surface-container": "#f2ebff",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-dim": "#ded6f0",
                        "surface-container-high": "#ece4fe",
                        "tertiary": "#874959",
                        "outline": "#797582",
                        "tertiary-container": "#a46172",
                        "primary-container": "#7867c0",
                        "on-tertiary-container": "#fffbff",
                        "error-container": "#ffdad6",
                        "primary-fixed-dim": "#cbbeff",
                        "on-secondary-fixed": "#002018",
                        "secondary-container": "#88f7d6",
                        "inverse-surface": "#322e41",
                        "primary": "#5f4ea5",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e6dff8",
                        "on-tertiary-fixed-variant": "#6e3444"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "container-padding-mobile": "20px",
                        "container-padding-desktop": "64px",
                        "md": "24px",
                        "sm": "12px",
                        "base": "8px",
                        "lg": "48px",
                        "xl": "80px"
                    },
                    "fontFamily": {
                        "body-lg": ["Work Sans"],
                        "body-md": ["Work Sans"],
                        "display-lg": ["Quicksand"],
                        "label-md": ["Work Sans"],
                        "headline-lg": ["Quicksand"],
                        "caption": ["Work Sans"],
                        "headline-lg-mobile": ["Quicksand"],
                        "headline-md": ["Quicksand"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],

                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],

                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]

                },
            },
        }

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(124, 107, 196, 0.1);
        }
        
        .pulse-ring {
            animation: pulse 3s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }
    </style>
</head>
<body class="bg-background h-screen w-screen overflow-hidden flex flex-col relative text-on-surface">
<!-- Background Image -->
<div class="absolute inset-0 z-0 bg-cover bg-center" data-alt="A serene, soft-focus nature scene depicting a misty forest at dawn. The colors are muted greens, gentle blues, and warm morning light. The image is highly blurred, creating a calming, abstract background texture that feels supportive and organic, fitting for a wellness sanctuary aesthetic. Light filters gently through unseen trees, offering a sense of hope and clarity." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC31z6MKZ-diYie0YuPUkNhOR2U7TlIYbyCsnQ0ICXH6knFHna78e_mDf4udzO9HEn5M4EqUs6ZKfuIOjL7hJ2o9a00vKBShUT2b9ukIwciIk8J9vxm-bpNrbBYHQZ1GtV4HZDBiJIyT9FpTZQWVcBRfGh5agR0OIE5crMCCAHG6NnlrQapX_1M0z4bhgJ8LiS5Qp3HB4HtpttwQMJxHrHN4oGSt-6jYGepU-NnVKlUwR4M_wgth_GkFQ')">
<div class="absolute inset-0 bg-background/30 backdrop-blur-md"></div>
</div>
<!-- Top Bar: Anonymous Call Pill -->
<div class="relative z-10 w-full pt-12 pb-4 px-container-padding-mobile flex justify-center items-start">
<div class="glass-panel px-6 py-2 rounded-full flex items-center space-x-2">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-md text-label-md text-primary">Anonymous Call</span>
</div>
</div>
<!-- Main Content: Participant Info -->
<div class="relative z-10 flex-1 flex flex-col items-center justify-center -mt-20">
<div class="relative flex items-center justify-center w-48 h-48 mb-6">
<!-- Pulsing Rings -->
<div class="absolute inset-0 rounded-full bg-primary-fixed pulse-ring"></div>
<div class="absolute inset-4 rounded-full bg-primary-fixed-dim pulse-ring" style="animation-delay: 1s;"></div>
<!-- Avatar Placeholder -->
<div class="relative z-20 w-32 h-32 rounded-full bg-surface-container-highest shadow-[0_8px_30px_rgba(98,81,168,0.15)] flex items-center justify-center border-4 border-surface overflow-hidden">
<span class="material-symbols-outlined text-primary text-6xl" style="font-variation-settings: 'FILL' 1;">face</span>
</div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Listener</h1>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center space-x-1">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span>Connected</span>
</p>
<p class="font-caption text-caption text-outline mt-2">12:45</p>
</div>
<!-- Controls: Floating Pill -->
<div class="relative z-10 w-full pb-12 px-container-padding-mobile flex justify-center items-end">
<div class="glass-panel p-2 rounded-full flex items-center space-x-4 shadow-[0_12px_40px_rgba(98,81,168,0.1)]">
<!-- Mute Button -->
<button class="w-14 h-14 rounded-full flex items-center justify-center bg-surface/50 hover:bg-surface transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant text-xl">mic</span>
</button>
<!-- Camera Button (Off by default) -->
<button class="w-14 h-14 rounded-full flex items-center justify-center bg-surface/50 hover:bg-surface transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface-variant text-xl">videocam_off</span>
</button>
<!-- End Call Button -->
<button class="w-16 h-16 rounded-full flex items-center justify-center bg-error hover:bg-error/90 transition-colors shadow-lg active:scale-95 ml-2">
<span class="material-symbols-outlined text-on-error text-2xl" style="font-variation-settings: 'FILL' 1;">call_end</span>
</button>
</div>
</div>
</body></html>
